<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <header class="site-header" role="banner">
    <div class="nav container">
      <a href="index.html" class="brand" aria-label="BPLAY">
        <img src="assets/brand/bplay-logo.png" alt="BPLAY" class="brand-logo"
             onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
        <span class="brand-fallback" style="display:none">BPLAY</span>
      </a>
      <div class="header-quick">
        <a href="cbu.html" class="vip-head-btn">CBU</a>
      </div>
      <nav class="nav-left nav-tabs" aria-label="Secciones">
        <a class="nav-link" href="cbu.html">Depositar</a>
        <a class="nav-link is-active" href="promos.html">Promos VIP</a>
        <a class="nav-link" href="sorteo.html">Sorteos</a>
      </nav>
      <nav class="nav-right nav-tabs" aria-label="Cuenta">
        <a class="nav-link" data-register-link href="#registro">Registrate</a>
        <a class="nav-link" data-login-link href="#login">Iniciar sesión</a>
      </nav>
      <div class="header-info">
        <div id="clock">--:--</div>
        <div id="geo">Argentina</div>
      </div>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="mobileMenu">
        <span class="nav-toggle__bar"></span><span class="nav-toggle__bar"></span><span class="nav-toggle__bar"></span>
      </button>
    </div>
    <nav id="mobileMenu" class="mobile-menu" hidden>
      <ul>
        <li><a href="cbu.html" class="menu-cbu">CBU</a></li>
        <li><a href="cbu.html">Depositar</a></li>
        <li><a href="promos.html">Promos VIP</a></li>
        <li><a href="sorteo.html">Sorteos</a></li>
        <li><a href="#registro" data-register-link>Registrate</a></li>
        <li><a href="#login" data-login-link>Iniciar sesión</a></li>
      </ul>
    </nav>
  </header>

  <main class="container narrow">
    <h1 class="page-title">Promociones <span class="badge badge-gold">VIP</span></h1>

    <!-- Slider + panel: los renderiza js/promos.js desde Supabase -->
    <div class="slider" id="promoSlider" data-slider>
      <div class="slides"></div>
      <div class="dots"></div>
    </div>

    <section class="stack" id="promoInfo" aria-live="polite" style="margin-top:var(--s-5)"></section>
  </main>

  <footer class="bp-footer" role="contentinfo">
    <div class="bp-footer__bottom">
      <div class="container bp-bottom__row">
        <p>© 2025 Bplay. Todos los derechos reservados.</p>
        <ul class="bp-legal-mini">
          <li><a href="/terminos">Términos</a></li>
          <li><a href="/politica-privacidad">Privacidad</a></li>
          <li><a href="/cookies">Cookies</a></li>
        </ul>

    </div>
  </footer>

  <script type="module" src="js/pages/promos.js"></script>

</html>
